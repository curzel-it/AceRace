<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>Ace Race</title>
<meta name="description" content="A card race of pure luck. Pick a suit and let the dealer do the rest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Ace Race</h1>
  <p class="tagline">A card race of pure luck</p>
</header>

<main>
  <div id="status" role="status" aria-live="polite">Pick a suit, then start the race.</div>

  <div id="board" aria-label="Race track">
    <div class="finish-line" aria-hidden="true"></div>
  </div>

  <div id="last-card" aria-live="polite">
    <span class="label">Last drawn:</span>
    <span class="value">—</span>
  </div>

  <div id="controls">
    <button id="draw-btn" type="button">
      <span class="btn-label">Draw next card</span>
      <span class="btn-sub" id="deck-count">—</span>
    </button>
    <button id="new-game-btn" type="button" class="ghost">New game</button>
  </div>
</main>

<div id="effects" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
